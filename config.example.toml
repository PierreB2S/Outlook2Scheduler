# Copiez ce fichier en « config.toml » (même dossier) et adaptez-le.
# config.toml n'est pas versionné (voir .gitignore).

# Nom affiché dans le sondage
nom = "Prénom N."

# Mot de passe When2meet (facultatif, propre à chaque sondage ; laisser vide en général)
mot_de_passe = ""

# Plage horaire acceptée (heure de ce poste), la même pour tous les jours.
# Plusieurs plages séparées par une virgule, par ex. pour exclure la pause de midi :
#   heures = "08:00-12:00, 14:00-18:00"
# Pour des horaires différents selon le jour : section [heures_par_jour] en fin de fichier.
heures = "08:30-18:00"

# Jours jamais proposés : lun, mar, mer, jeu, ven, sam, dim (ou [] pour aucun)
jours_exclus = ["sam", "dim"]

# Rendez-vous « provisoires » comptés comme libres ?
provisoire_libre = false

# Statut « travaille ailleurs » compté comme libre ?
ailleurs_libre = true

# Marge en minutes avant et après chaque réunion (0 = aucune)
marge_minutes = 0

# Lecture d'Outlook : "rendez-vous" (défaut, sans alerte de sécurité) ou "freebusy".
# Attention avec "freebusy" : Outlook fusionne lui-même les rendez-vous qui se
# chevauchent, et une réunion posée dans un bloc « travaille ailleurs »
# (télétravail) peut y être masquée. "rendez-vous" lit chaque réunion séparément.
source_agenda = "rendez-vous"

# Accès Internet : "windows" (comme Edge, gère le proxy d'entreprise ; défaut) ou "python"
reseau = "windows"

# Horaires propres à certains jours (facultatif). Les jours non listés gardent « heures ».
# Jours : lun, mar, mer, jeu, ven, sam, dim. "aucune" = jamais disponible ce jour-là.
# Cette section doit rester À LA FIN du fichier : tout ce qui la suit serait lu comme un jour.
# Retirez les # devant les lignes à utiliser :
# [heures_par_jour]
# mer = "08:00-12:00"
# ven = "08:00-12:00, 13:30-16:00"
